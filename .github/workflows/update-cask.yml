name: Update Homebrew Cask

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 2 点（北京时间 10 点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest release version
        id: release
        run: |
          latest=$(curl -s https://api.github.com/repos/ayangweb/BongoCat/releases/latest | jq -r .tag_name)
          version=${latest#v}
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Read current version
        id: current
        run: |
          current=$(grep -Eo 'version "[^"]+"' Casks/bongo-cat.rb | sed 's/version "\(.*\)"/\1/')
          echo "current=$current" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.current }}" = "${{ steps.release.outputs.version }}" ]; then
            echo "update=false" >> $GITHUB_OUTPUT
          else
            echo "update=true" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no update
        if: steps.check.outputs.update == 'false'
        run: echo "No new version. Skip."

      - name: Download and calculate sha256
        if: steps.check.outputs.update == 'true'
        id: sha
        run: |
          version=${{ steps.release.outputs.version }}
          base="https://github.com/ayangweb/BongoCat/releases/download/v${version}"

          curl -L -o x64.tar.gz "$base/BongoCat_x64.app.tar.gz"
          curl -L -o arm.tar.gz "$base/BongoCat_aarch64.app.tar.gz"

          sha_x64=$(sha256sum x64.tar.gz | awk '{print $1}')
          sha_arm=$(sha256sum arm.tar.gz | awk '{print $1}')

          echo "sha_x64=$sha_x64" >> $GITHUB_OUTPUT
          echo "sha_arm=$sha_arm" >> $GITHUB_OUTPUT

      - name: Update cask file (safe)
        if: steps.check.outputs.update == 'true'
        run: |
          version="${{ steps.release.outputs.version }}"
          sha_x64="${{ steps.sha.outputs.sha_x64 }}"
          sha_arm="${{ steps.sha.outputs.sha_arm }}"

          # 更新 version（只匹配行首，避免误伤）
          sed -i 's/^  version ".*"/  version "'"$version"'"/' Casks/bongo-cat.rb

          # 只在 sha256 block 内更新 arm
          sed -i '/sha256 arm:/,/intel:/ s/sha256 arm: *".*"/sha256 arm: "'"$sha_arm"'"/' Casks/bongo-cat.rb

          # 只在 sha256 block 内更新 intel
          sed -i '/sha256 arm:/,/intel:/ s/intel: *".*"/intel: "'"$sha_x64"'"/' Casks/bongo-cat.rb

      - name: Commit and push
        if: steps.check.outputs.update == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 防止远程有更新导致 push 失败
          git pull --rebase

          git add Casks/bongo-cat.rb

          git commit -m "chore: update bongo-cat cask to v${{ steps.release.outputs.version }}"
          git push
